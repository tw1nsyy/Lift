name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project LIFT.xcodeproj -scheme LIFT -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show compile errors in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Compile errors'
            echo '```'
            grep -E "error:" build.log | sort -u | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package .ipa
        shell: bash
        run: |
          APP=build/Build/Products/Release-iphoneos/LIFT.app
          test -f "$APP/LIFT" || { echo "The app binary was not produced - the build failed."; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr LIFT.ipa Payload
          ls -lh LIFT.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LIFT-ipa
          path: LIFT.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

  tests:
    # Unit tests run only when started by hand (Actions -> iOS build -> Run workflow),
    # so a normal push needs just one macOS runner.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Using simulator $UDID"
          xcodebuild test -project LIFT.xcodeproj -scheme LIFT \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
      - name: Show errors in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Test / compile errors'
            echo '```'
            grep -E "error:|failed" test.log | sort -u | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
